@if (sessionFailed()) {
  <app-panel-state [error]="session.error()" (retry)="session.load()" />
} @else {
  <div class="account">
    <aside class="account__side" aria-label="Профиль клиента">
      <app-account-header class="account__header" [client]="session.client()" />
      <app-account-nav class="account__nav" [items]="nav" />
    </aside>

    <div class="account__content">
      <router-outlet />
    </div>
  </div>
}
