<h1 class="visually-hidden">Мастера рядом на карте</h1>

<header class="top">
  <app-search-bar
    class="top__search"
    [value]="text()"
    (valueChange)="onText($event)"
    [suggestions]="suggestions()"
    (pick)="pick($event)"
  />
  <app-filter-chips
    class="top__chips"
    [filters]="store.filters()"
    (openSection)="openFilters($event)"
    (toggleFilter)="toggle($event)"
  />
</header>

<app-search-map
  #map
  class="map"
  [class.map--card]="showCard()"
  [pins]="pins()"
  [center]="store.location()"
  [selectedId]="store.selectedId()"
  [highlightId]="store.hoveredId()"
  (pinSelect)="selectPin($event)"
/>

<button type="button" class="support-tab" (click)="support.open()">
  <app-icon name="message-square" [size]="18" />
  <span class="support-tab__label">Напишите нам</span>
</button>

@if (showCard() && selected(); as r) {
  <div class="pin-card">
    <app-master-mini-card [result]="r" [active]="true" />
    <button
      type="button"
      class="pin-card__close"
      aria-label="Закрыть карточку мастера"
      (click)="store.select(null)"
    >
      <app-icon name="x" [size]="16" />
    </button>
  </div>
}

<section
  #panel
  class="panel"
  [class.panel--dragging]="dragHeight() !== null"
  [attr.data-snap]="snap()"
  [style.height.px]="dragHeight()"
  aria-label="Список мастеров"
>
  <span #peek class="panel__peek" aria-hidden="true"></span>
  @if (session.isGuest() && (isMd() || (listClosed() && !showCard()))) {
    <a
      class="btn btn--primary btn--pill login-fab"
      routerLink="/login"
      [queryParams]="{ redirect: '/' }"
    >
      Войти
    </a>
  }
  <app-list-header
    [count]="store.results().length"
    [onlineCount]="store.onlineCount()"
    [loading]="store.loading()"
    [collapsible]="!isMd()"
    [snap]="snap()"
    (handleTap)="toggleSheet()"
    (snapChange)="snap.set($event)"
    (dragStart)="onDragStart()"
    (dragMove)="onDragMove($event)"
    (dragEnd)="onDragEnd($event)"
    [showSort]="!listClosed()"
    [sort]="store.sort()"
    (sortChange)="store.setSort($event)"
  />
  <app-master-list
    id="search-results"
    class="panel__list"
    [attr.inert]="listClosed() ? '' : null"
    [results]="store.results()"
    [loading]="store.loading() || (store.slotsLoading() && store.filters().freeWindow !== null)"
    [error]="store.error()"
    [followSelected]="!listClosed()"
    [selectedId]="store.selectedId()"
    [favoriteIds]="session.favoriteIds()"
    [ownId]="session.master()?.id ?? null"
    [hasCriteria]="store.hasCriteria()"
    (book)="book($event)"
    (write)="message($event)"
    (favorite)="favorite($event)"
    (hover)="store.hover($event)"
    (retry)="store.load()"
    (resetFilters)="reset()"
  />
</section>

<app-filters-sheet
  [(open)]="sheetOpen"
  [section]="sheetSection()"
  [filters]="draft()"
  (filtersChange)="onDraft($event)"
  [previewCount]="previewCount()"
  [previewLoading]="store.slotsLoading()"
  (apply)="applyFilters()"
/>
