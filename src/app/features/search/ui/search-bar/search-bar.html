<div class="sb" role="search">
  <label class="sb__field">
    <app-icon class="sb__icon" name="search" [size]="20" />
    <span class="visually-hidden">Поиск мастеров</span>
    <input
      #input
      class="sb__input"
      type="search"
      role="combobox"
      autocomplete="off"
      enterkeyhint="search"
      placeholder="Мастер, услуга, район..."
      aria-autocomplete="list"
      aria-controls="search-suggestions"
      [attr.aria-expanded]="open()"
      [attr.aria-activedescendant]="active() >= 0 ? 'search-suggestion-' + active() : null"
      [value]="value()"
      (input)="onInput($event)"
      (keydown)="onKeydown($event)"
      (focus)="focused.set(true)"
      (blur)="onBlur()"
    />
  </label>
  @if (value()) {
    <button type="button" class="sb__clear" aria-label="Очистить поиск" (click)="clear(input)">
      <app-icon name="x" [size]="18" />
    </button>
  }

  <ul
    class="sb__list"
    id="search-suggestions"
    role="listbox"
    aria-label="Услуги"
    [hidden]="!open()"
  >
    @for (s of suggestions(); track s.kind + s.id; let i = $index) {
      <!-- Keyboard selection is handled on the input (aria-activedescendant). -->
      <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
      <li
        class="sb__option"
        role="option"
        [id]="'search-suggestion-' + i"
        [attr.aria-selected]="i === active()"
        (mousedown)="$event.preventDefault()"
        (click)="choose(s)"
      >
        <app-icon [name]="s.kind === 'category' ? 'sparkles' : 'search'" [size]="16" />
        <span class="sb__label">{{ s.label }}</span>
        @if (s.hint) {
          <span class="sb__hint">{{ s.hint }}</span>
        }
      </li>
    }
  </ul>
</div>
