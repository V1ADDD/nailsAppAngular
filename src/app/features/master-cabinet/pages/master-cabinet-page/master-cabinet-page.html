<header class="head">
  <div class="head__inner">
    <h1 class="display-title">Кабинет мастера</h1>
    <span class="head__avatar" aria-hidden="true">{{ initial() }}</span>
  </div>
</header>

<div class="page">
  @if (!session.snapshot()) {
    @if (session.error(); as error) {
      <div class="empty-state card" role="alert">
        <p class="empty-state__title">Не удалось загрузить профиль</p>
        <p>{{ error }}</p>
        <button type="button" class="btn btn--outline btn--sm" (click)="session.load()">
          Повторить
        </button>
      </div>
    } @else {
      <div class="stack" aria-busy="true" aria-label="Загружаем кабинет">
        <div class="skeleton page__skeleton page__skeleton--tall"></div>
        <div class="skeleton page__skeleton"></div>
        <div class="skeleton page__skeleton"></div>
        <div class="skeleton page__skeleton"></div>
      </div>
    }
  } @else if (!session.isMaster()) {
    <div class="page__onboarding">
      <app-become-master [saving]="store.saving()" (submitted)="becomeMaster($event)" />
    </div>
  } @else {
    <div class="grid">
      <div class="col col--main">
        <app-schedule-section class="order-2" />
        <app-clients-section class="order-3" />
      </div>
      <div class="col col--side">
        <app-card-section class="order-1" />
        <app-stats-section class="order-6" />
        <app-services-section class="order-4" />
        <app-portfolio-section class="order-5" />
        <app-verification-section class="order-7" />
      </div>
    </div>
  }
</div>
